{% extends 'mailings/base.html' %}

{% block title %} - Пароль изменён{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h3 class="mb-0">✅ Пароль изменён</h3>
            </div>
            <div class="card-body">
                <p>Поздравляем! Вы успешно изменили пароль своего аккаунта.</p>
                <p>Используйте новый пароль для входа в систему.</p>

                <a href="{% url 'users:login' %}" class="btn btn-primary">🔐 Войти</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
