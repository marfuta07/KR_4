{% extends 'mailings/base.html' %}

{% block title %} - Удаление рассылки{% endblock %}

{% block content %}
<h1>🗑️ Удалить рассылку?</h1>

<p>Вы уверены, что хотите удалить рассылку <strong>#{{ mailing.pk }}</strong> ({{ mailing.message.subject }})?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">🗑️ Удалить</button>
    <a href="{% url 'mailings:mailing_list' %}" class="btn btn-outline-secondary">Отмена</a>
</form>
{% endblock %}
