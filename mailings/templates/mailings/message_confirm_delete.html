{% extends 'mailings/base.html' %}

{% block title %} - Удаление сообщения{% endblock %}

{% block content %}
<h1>🗑️ Удалить сообщение?</h1>

<p>Вы уверены, что хотите удалить сообщение <strong>"{{ message.subject }}"</strong>?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">🗑️ Удалить</button>
    <a href="{% url 'mailings:message_list' %}" class="btn btn-outline-secondary">Отмена</a>
</form>
{% endblock %}
